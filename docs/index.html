<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>J7 Web Installer</title>
    <style>
      :root { color-scheme:dark; font-family:Arial Narrow,"Roboto Condensed","Helvetica Neue",sans-serif; background:#070909; color:#eeeae2; --red:#ed3d2f; --line:rgba(238,234,226,.09) }
      * { box-sizing:border-box }
      body { min-height:100vh; margin:0; padding:22px; background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:52px 52px }
      body::before { content:"J7"; position:fixed; right:-4vw; top:5vh; z-index:-1; color:rgba(255,255,255,.025); font-size:min(80vw,520px); font-weight:900; line-height:.8; letter-spacing:-.12em }
      header,main { width:min(100%,620px); margin:auto }
      header { display:flex; align-items:center; justify-content:space-between; padding-bottom:20px; border-bottom:1px solid var(--line) }
      .brand { display:flex; align-items:center; gap:11px; font:700 11px/1 ui-monospace,monospace; letter-spacing:.28em }
      .mark { color:var(--red); font-size:25px; letter-spacing:-.1em }
      .code { color:#777; font:10px/1 ui-monospace,monospace; letter-spacing:.18em }
      main { margin-top:clamp(54px,12vh,110px) }
      .eyebrow { display:flex; align-items:center; gap:9px; color:#aaa; font:700 10px/1 ui-monospace,monospace; letter-spacing:.2em; text-transform:uppercase }
      .eyebrow::before { content:""; width:7px; height:7px; background:var(--red) }
      h1 { max-width:520px; margin:18px 0 12px; font-size:clamp(54px,15vw,96px); line-height:.82; letter-spacing:-.075em; text-transform:uppercase }
      h1 span { color:var(--red) }
      .intro { max-width:470px; margin:0 0 34px; color:#aaa; font:600 14px/1.6 ui-monospace,monospace }
      .panel { position:relative; padding:20px; border:1px solid rgba(238,234,226,.18); background:rgba(7,9,9,.9) }
      .panel::before { content:"ADB / WEBUSB"; position:absolute; top:-10px; right:14px; padding:4px 8px; background:var(--red); color:#fff; font:700 8px/1 ui-monospace,monospace; letter-spacing:.16em }
      .step { margin:14px 0 7px; color:#777; font:700 9px/1 ui-monospace,monospace; letter-spacing:.18em; text-transform:uppercase }
      button,input { width:100%; min-height:58px; padding:16px; border-radius:0; font:700 12px/1 ui-monospace,monospace; letter-spacing:.1em; text-transform:uppercase }
      button { border:1px solid #eeeae2; background:#eeeae2; color:#070909; cursor:pointer }
      button:active { background:var(--red); border-color:var(--red); color:#fff }
      button:disabled { opacity:.3 }
      input { border:1px solid var(--line); background:#0d1010; color:#aaa; text-transform:none; letter-spacing:0 }
      pre { min-height:96px; margin:16px 0 0; padding:15px; overflow:auto; white-space:pre-wrap; border:1px solid var(--line); background:#030404; color:#74d9d0; font:12px/1.5 ui-monospace,SFMono-Regular,monospace }
      @media (min-width:700px) { body { padding:30px } .panel { padding:26px } }
    </style>
    <script type="module" crossorigin src="./assets/index-Czp0Z8mX.js"></script>
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark">双</span> SUREIZU</div>
      <div class="code">SRZ / J7-001 · <span id="version"></span></div>
    </header>
    <main>
      <div class="eyebrow">Infotainment utility</div>
      <h1>Install.<br><span>Drive.</span></h1>
      <p class="intro">A direct, private APK installer for your J7. Connect via USB OTG and close any other ADB apps.</p>
      <section class="panel">
      <div class="step">01 — Pair device</div>
      <button id="connect">Connect to car ↗</button>
      <div class="step">02 — Select package</div>
      <input id="apk" aria-label="Select APK file" type="file" accept=".apk,application/vnd.android.package-archive" disabled>
      <div class="step">03 — Deploy</div>
      <button id="install" disabled>Install APK ↗</button>
      <pre id="status" aria-live="polite">Ready.</pre>
      </section>
    </main>
  </body>
</html>
