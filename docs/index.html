<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#090a0a">
    <title>J7 Installer — Sureizu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme:dark; --black:#090a0a; --panel:#111313; --ivory:#f1ece2; --muted:#aaa9a3; --red:#e14837; --line:rgba(241,236,226,.16) }
      * { box-sizing:border-box }
      body { min-height:100svh; margin:0; background:var(--black); color:var(--ivory); font-family:"JetBrains Mono",monospace; -webkit-font-smoothing:antialiased }
      body::before { content:""; position:fixed; inset:0; pointer-events:none; background-image:linear-gradient(rgba(241,236,226,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(241,236,226,.035) 1px,transparent 1px); background-size:52px 52px }
      body::after { content:"J7"; position:fixed; right:-.04em; top:.12em; z-index:-1; color:rgba(241,236,226,.025); font:68vw/.72 "Bebas Neue",Impact,sans-serif }
      header { position:relative; display:flex; align-items:center; justify-content:space-between; height:72px; padding:0 max(24px,calc((100vw - 1120px)/2)); border-bottom:1px solid var(--line); background:rgba(9,10,10,.84); backdrop-filter:blur(16px) }
      .brand { display:flex; align-items:center; gap:11px; font-size:.72rem; font-weight:700; letter-spacing:.22em }
      .mark { width:36px; height:36px; object-fit:contain; filter:invert(35%) sepia(70%) saturate(1740%) hue-rotate(337deg) brightness(96%) contrast(84%) }
      .code,.meta,.step { color:var(--muted); font-size:.55rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase }
      main { position:relative; display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(42px,7vw,110px); width:min(1120px,calc(100% - 48px)); margin:auto; padding:clamp(64px,10vh,110px) 0 48px }
      .eyebrow { display:flex; align-items:center; gap:10px; margin-bottom:24px; color:var(--muted); font-size:.61rem; font-weight:600; letter-spacing:.19em; text-transform:uppercase }
      .eyebrow::before { content:""; width:7px; height:7px; background:var(--red) }
      h1 { margin:0; font:400 clamp(5.2rem,10vw,9.4rem)/.77 "Bebas Neue",Impact,sans-serif; letter-spacing:-.015em; text-transform:uppercase }
      h1 span { display:block; color:var(--red) }
      .intro { max-width:540px; margin:32px 0 0; color:#c7c4bd; font-size:.78rem; line-height:1.75 }
      .meta { display:flex; justify-content:space-between; margin-top:48px; padding-top:18px; border-top:1px solid var(--line) }
      .panel { position:relative; align-self:center; border:1px solid var(--line); background:rgba(17,19,19,.94) }
      .panel-head { display:flex; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line) }
      .seal { margin:-14px -16px -14px 0; padding:14px 10px; background:var(--red); color:var(--ivory); font-size:.5rem; font-weight:700; letter-spacing:.12em }
      .controls { padding:20px }
      .step { margin:16px 0 8px }
      .step:first-child { margin-top:0 }
      button,input { width:100%; min-height:50px; border-radius:0; font-family:"JetBrains Mono",monospace }
      button { padding:14px 16px; border:1px solid var(--ivory); background:var(--ivory); color:var(--black); cursor:pointer; font-size:.66rem; font-weight:700; letter-spacing:.08em; text-align:left; text-transform:uppercase }
      button::after { content:"\2197"; float:right; font-size:1rem; line-height:.65 }
      button:hover,button:active { border-color:var(--red); background:var(--red); color:var(--ivory) }
      button:disabled { cursor:not-allowed; opacity:.28 }
      input { padding:12px; border:1px solid var(--line); background:var(--black); color:var(--muted); font-size:.68rem }
      pre { min-height:94px; max-height:210px; margin:20px 0 0; padding:14px; overflow:auto; white-space:pre-wrap; border:1px solid var(--line); background:#050606; color:var(--ivory); font:500 .66rem/1.55 "JetBrains Mono",monospace }
      pre::selection { background:var(--red) }
      button:focus-visible,input:focus-visible { outline:2px solid var(--red); outline-offset:3px }
      @media (max-width:760px) {
        header { height:64px; padding:0 18px }
        .mark { width:34px; height:34px }
        .code { max-width:130px; text-align:right; line-height:1.5 }
        main { grid-template-columns:1fr; gap:42px; width:calc(100% - 36px); padding:56px 0 30px }
        h1 { font-size:clamp(4.8rem,22vw,7rem) }
        .intro { margin-top:24px }
        .meta { margin-top:30px }
        .panel { align-self:auto }
        .controls { padding:16px }
        button,input { min-height:48px }
      }
    </style>
    <script type="module" crossorigin src="./assets/index--JdP2Hok.js"></script>
  </head>
  <body>
    <header>
      <div class="brand"><img class="mark" src="./sureizu-mark.svg" alt=""> SUREIZU</div>
      <div class="code">SRZ / J7-001 · <span id="version"></span></div>
    </header>
    <main>
      <section>
        <div class="eyebrow">Infotainment utility</div>
        <h1>Install.<span>Drive.</span></h1>
        <p class="intro">A direct, private APK installer for your J7. Connect via USB OTG and close any other ADB apps.</p>
        <div class="meta"><span>DesaySV</span><span>Android 11</span><span>WebUSB</span></div>
      </section>
      <section class="panel">
        <div class="panel-head"><span class="code">Deployment console</span><span class="seal">ADB / USB</span></div>
        <div class="controls">
          <div class="step">01 — Pair device</div>
          <button id="connect">Connect to car</button>
          <div class="step">02 — Select package</div>
          <input id="apk" aria-label="Select APK file" type="file" accept=".apk,application/vnd.android.package-archive" disabled>
          <div class="step">03 — Deploy</div>
          <button id="install" disabled>Install APK</button>
          <pre id="status" aria-live="polite">Ready.</pre>
        </div>
      </section>
    </main>
    <script src="./webadb.js"></script>
  </body>
</html>
